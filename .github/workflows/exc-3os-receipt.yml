name: exc-3os-receipt

# Fork-only 3-OS receipts for immutable verification commits. This workflow
# never appears in the microsoft/SkillOpt feature PR diffs.
on:
  workflow_dispatch:
  push:
    branches: [ci/exc-3os-receipt]

permissions:
  contents: read

jobs:
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        case:
          - pr: "242"
            branch: verify/pr242-eb845b6
            expected: eb845b6bc13e868308faa39c837722657fd09b76
            wiring: tests/test_evalkit.py
          - pr: "244"
            branch: verify/pr244-c48d938
            expected: c48d93874dff42f4ae845292a7ce6e0f4a86fd10
            wiring: tests/test_llm_dream.py
    name: PR ${{ matrix.case.pr }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone immutable verification branch
        env:
          BRANCH: ${{ matrix.case.branch }}
          EXPECTED: ${{ matrix.case.expected }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$BRANCH" https://github.com/bogdanbaciu21/SkillOpt skillopt
          cd skillopt
          HEAD_SHA=$(git rev-parse HEAD)
          echo "PR=${{ matrix.case.pr }}"
          echo "PLATFORM=$(uname -srm)"
          python --version
          echo "BRANCH=$BRANCH"
          echo "BRANCH_HEAD=$HEAD_SHA"
          echo "EXPECTED_HEAD=$EXPECTED"
          test "$HEAD_SHA" = "$EXPECTED"
      - name: Install complete test environment
        run: |
          set -euo pipefail
          cd skillopt
          python -m venv .venv
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python; fi
          "$PY" -m pip install -q -e ".[dev]" pytest-timeout
          "$PY" -m pytest --collect-only -q
      - name: Run focused wiring check
        env:
          WIRING: ${{ matrix.case.wiring }}
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python; fi
          "$PY" -m pytest "$WIRING" -q
      - name: Run entire repository test suite
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python; fi
          "$PY" -m pytest -q -rf --timeout=120 --timeout-method=thread
          echo "PYTEST_RC=0"
