name: exc-3os-baseline-receipt

# Fork-only control run for current microsoft/SkillOpt main. This workflow
# never appears in either feature PR diff.
on:
  workflow_dispatch:
  push:
    branches: [ci/exc-3os-receipt]

permissions:
  contents: read

jobs:
  upstream-baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    name: upstream main / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone immutable upstream control
        env:
          BRANCH: verify/upstream-0389ace
          EXPECTED: 0389ace56339988e16ca5ddab36f0978776fe9b0
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$BRANCH" https://github.com/bogdanbaciu21/SkillOpt skillopt
          cd skillopt
          HEAD_SHA=$(git rev-parse HEAD)
          echo "CONTROL=upstream-main"
          echo "PLATFORM=$(uname -srm)"
          python --version
          echo "BRANCH=$BRANCH"
          echo "BRANCH_HEAD=$HEAD_SHA"
          echo "EXPECTED_HEAD=$EXPECTED"
          test "$HEAD_SHA" = "$EXPECTED"
      - name: Install complete test environment
        run: |
          set -euo pipefail
          cd skillopt
          python -m venv .venv
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python; fi
          "$PY" -m pip install -q -e ".[dev]" pytest-timeout
          "$PY" -m pytest --collect-only -q
      - name: Run entire repository test suite
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python; fi
          "$PY" -m pytest -q -rf --timeout=120 --timeout-method=thread
          echo "PYTEST_RC=0"
