name: exc-final-3os-validation

# Fork-only validation receipt. This workflow is intentionally kept off the
# feature branches so it never appears in the upstream PR diffs.
on:
  workflow_dispatch:
  push:
    branches: [ci/exc-3os-receipt]

permissions:
  contents: read

jobs:
  full-suite:
    name: ${{ matrix.target.name }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        target:
          - name: platform-baseline
            branch: verify/common-platform-ab236c6
            sha: 68ae4fbe1103a954c52892590a1a0b207c662689
            focused: tests/test_sleep_adopt_skill_subset.py::TestDurableAdoptionTransaction::test_restart_cleans_own_hardlink_publication_temp -s
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone and verify immutable candidate
        env:
          BRANCH: ${{ matrix.target.branch }}
          EXPECTED_SHA: ${{ matrix.target.sha }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$BRANCH" https://github.com/bogdanbaciu21/SkillOpt skillopt
          cd skillopt
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "platform=$(uname -srm)"
          python --version
          echo "branch=$BRANCH"
          echo "expected_sha=$EXPECTED_SHA"
          echo "actual_sha=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Install development test environment
        run: |
          set -euo pipefail
          cd skillopt
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then
            PY=.venv/Scripts/python.exe
          else
            PY=.venv/bin/python
          fi
          "$PY" -m pip install --disable-pip-version-check -q -e ".[dev]" pytest-timeout
          "$PY" --version

      - name: Run focused feature regressions
        env:
          FOCUSED: ${{ matrix.target.focused }}
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/Scripts/python.exe ]; then
            PY=.venv/Scripts/python.exe
          else
            PY=.venv/bin/python
          fi
          "$PY" -m pytest $FOCUSED -q

      - name: Run entire repository test suite
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/Scripts/python.exe ]; then
            PY=.venv/Scripts/python.exe
          else
            PY=.venv/bin/python
          fi
          "$PY" -m pytest -q -rf --timeout=120 --timeout-method=thread
