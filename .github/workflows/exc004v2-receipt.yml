name: exc004v2-validation

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Fork branch to verify
        required: true
        default: exc-004-adversarial-probes
      expected_sha:
        description: Exact candidate commit
        required: true
        default: 4d93cad055f9210438867d02c8e7c24236902040
      focused_suite:
        description: Focused regression slice
        required: true
        type: choice
        options: [adversarial, gate]
        default: adversarial
  push:
    branches: [ci/exc004v2-receipt]

permissions:
  contents: read

jobs:
  full-suite:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "ubuntu / py3.10", os: ubuntu-latest, python: "3.10"}
          - {name: "ubuntu / py3.11", os: ubuntu-latest, python: "3.11"}
          - {name: "ubuntu / py3.12", os: ubuntu-latest, python: "3.12"}
          - {name: "macos-arm64 / py3.12", os: macos-14, python: "3.12"}
          - {name: "windows / py3.12", os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Clone and verify immutable candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '4d93cad055f9210438867d02c8e7c24236902040' }}
          CANDIDATE_REF: ${{ inputs.candidate_ref || 'exc-004-adversarial-probes' }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$CANDIDATE_REF" https://github.com/bogdanbaciu21/SkillOpt skillopt
          cd skillopt
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "platform=$(uname -srm)"
          python --version
          echo "expected_sha=$EXPECTED_SHA"
          echo "actual_sha=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Install test and docs environment
        run: |
          set -euo pipefail
          cd skillopt
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --disable-pip-version-check -q -e ".[dev,docs]" pytest-timeout
          "$PY" --version
      - name: Run focused feature and integration regressions
        env:
          FOCUSED_SUITE: ${{ inputs.focused_suite || 'adversarial' }}
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          if [ "$FOCUSED_SUITE" = gate ]; then
            "$PY" -m pytest tests/test_gate.py -q --timeout=120 --timeout-method=thread
          else
            "$PY" -m pytest tests/test_adversarial_dream.py tests/test_sleep_engine.py tests/test_gate_no_regression.py tests/test_consolidate_split.py tests/test_split_hardening_2x3.py -q --timeout=120 --timeout-method=thread
          fi
      - name: Run entire repository test suite
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pytest -q -rf --timeout=120 --timeout-method=thread
      - name: Build documentation strictly
        if: matrix.python == '3.12'
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m mkdocs build --strict
