name: exc003v2-validation

on:
  workflow_dispatch:
  push:
    branches: [ci/exc003v2-receipt]

permissions:
  contents: read

jobs:
  full-suite:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "ubuntu / py3.10", os: ubuntu-latest, python: "3.10"}
          - {name: "ubuntu / py3.11", os: ubuntu-latest, python: "3.11"}
          - {name: "ubuntu / py3.12", os: ubuntu-latest, python: "3.12"}
          - {name: "macos-arm64 / py3.12", os: macos-14, python: "3.12"}
          - {name: "windows / py3.12", os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Clone and verify immutable candidate
        env:
          EXPECTED_SHA: dfabedec9a134f6420f2f9339c927cea7fdb1811
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch exc-003-v2 https://github.com/bogdanbaciu21/SkillOpt skillopt
          cd skillopt
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "platform=$(uname -srm)"
          python --version
          echo "expected_sha=$EXPECTED_SHA"
          echo "actual_sha=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Install test and docs environment
        run: |
          set -euo pipefail
          cd skillopt
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --disable-pip-version-check -q -e ".[dev,docs]" pytest-timeout
          "$PY" --version
      - name: Run focused feature and integration regressions
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pytest tests/test_llm_dream.py tests/test_sleep_engine.py tests/test_sleep_evidence.py tests/test_backend_opencode.py tests/test_backend_pi.py tests/test_plugin_sync.py -q --timeout=120 --timeout-method=thread
      - name: Run entire repository test suite
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pytest -q -rf --timeout=120 --timeout-method=thread
      - name: Build documentation strictly
        if: matrix.python == '3.12'
        run: |
          set -euo pipefail
          cd skillopt
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m mkdocs build --strict
